# Configuration RabbitMQ — montée en volume (pas d'image customisée).
# Charge les définitions (users/vhosts/permissions/queues) au démarrage.

# Chargement des définitions au démarrage (user STOMP, vhosts, queue work-ask, ...)
load_definitions = /etc/rabbitmq/rabbitmq-definitions.json

# Écouteurs
listeners.tcp.default = 5672

# STOMP
stomp.listeners.tcp.default = 61613

# Web STOMP
web_stomp.tcp.port = 15674
web_stomp.tcp.ip = 0.0.0.0

# Management
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Note sécurité : guest n'est plus 'administrator' (voir rabbitmq-definitions.json).
# Les services internes se connectent encore via guest/guest (compat) ; à terme,
# migrer vers un user applicatif dédié (ex. stomp-user).
